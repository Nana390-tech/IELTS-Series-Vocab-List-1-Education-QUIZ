<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordlist 1 — Education | B1+ Vocabulary Quiz</title>
<style>
/* ============================================================
   INK & HIGHLIGHTER  —  B1+ Vocabulary List 1 (Fall) "Education"
   ============================================================ */
:root{
  --ink:#332B1E;
  --ink-2:#5A4C34;
  --paper:#F8F4E9;
  --card:#FFFFFF;
  --slate:#7A6B53;
  --rule:#E3DAC6;
  --hl-1:#E8B52E;
  --hl-2:#A8C98A;
  --hl-3:#F0A3A0;
  --hl-4:#F2C98A;
  --hl-5:#C8B6E0;
  --hl-6:#9FC6DE;
  --hl-7:#D9D96B;
  --good:#3F7A3A;
  --good-bg:#EDF4EA;
  --bad:#B33A2B;
  --bad-bg:#FAEDEA;
  --display: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --read: Georgia,"Times New Roman",serif;
  --mono: "Courier New",ui-monospace,monospace;
  --ar: "Segoe UI","Tahoma","Geeza Pro","Arabic Typesetting",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--display);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}

/* ---------- shell ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}

/* ---------- masthead ---------- */
header.mast{
  border-bottom:2px solid var(--ink);
  padding:26px 0 16px;
  margin-bottom:26px;
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:18px;
}
.mast h1{
  font-size:clamp(28px,4.6vw,44px);
  font-weight:800;letter-spacing:-.035em;line-height:1;
  margin:0;text-transform:lowercase;
}
.mast .sub{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--slate);margin:8px 0 0;
}
.mast .spacer{flex:1}
.chip{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;border:1.5px solid var(--ink);
  padding:5px 10px;white-space:nowrap;
}

/* ---------- highlighter swipe (signature) ---------- */
.hl{position:relative;z-index:0;font-weight:700;padding:0 .05em}
.hl::before{
  content:"";position:absolute;left:-.18em;right:-.18em;top:.12em;bottom:.02em;
  background:var(--swipe,var(--hl-1));
  transform:skewX(-9deg) rotate(-.7deg);
  z-index:-1;border-radius:2px 6px 3px 5px;
  animation:swipe .5s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes swipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* ---------- start screen ---------- */
.start{max-width:760px}
.lede{font-family:var(--read);font-size:19px;line-height:1.65;color:var(--ink-2);margin:0 0 28px}
.namefield{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 30px}
.namefield input{
  border:none;border-bottom:2px solid var(--ink);background:transparent;
  font-size:19px;padding:6px 4px;min-width:240px;color:var(--ink);
}
.namefield input:focus{outline:none;border-bottom-color:var(--good);background:#FBF3D8}
.namefield label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}

.plan{border-top:1px solid var(--rule);margin:0 0 30px}
.plan-row{
  display:flex;gap:14px;align-items:baseline;
  padding:11px 0;border-bottom:1px solid var(--rule);
}
.plan-tag{
  width:30px;height:16px;flex:none;border-radius:2px 5px 3px 4px;
  transform:skewX(-9deg);margin-top:3px;
}
.plan-name{font-weight:700;font-size:15px;flex:1;min-width:150px}
.plan-desc{font-family:var(--read);font-size:14px;color:var(--slate);flex:2.2;min-width:180px}
.plan-n{font-family:var(--mono);font-size:12px;color:var(--slate);white-space:nowrap}

.btn{
  border:2px solid var(--ink);background:var(--ink);color:#fff;
  font-weight:700;font-size:15px;padding:12px 24px;border-radius:0;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--hl-1)}
.btn:active{transform:translate(0,0);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{box-shadow:4px 4px 0 var(--hl-2)}
.btn.sm{font-size:13px;padding:8px 14px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.btnrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* ---------- quiz layout ---------- */
.layout{display:grid;grid-template-columns:1fr 232px;gap:34px;align-items:start}

/* ---------- question card ---------- */
.card{
  background:var(--card);border:2px solid var(--ink);
  padding:26px 28px 24px;position:relative;
}
.card::after{
  content:"";position:absolute;inset:6px -6px -6px 6px;
  border:2px solid var(--ink);z-index:-1;opacity:.16;
}
.qhead{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-bottom:12px;margin-bottom:18px;border-bottom:1px solid var(--rule);
}
.qnum{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.06em}
.sectag{
  font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  padding:4px 9px;border-radius:2px 6px 3px 5px;font-weight:700;color:var(--ink);
}
.qhead .spacer{flex:1}
.instr{
  font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--slate);
}
.prompt{font-size:17px;font-weight:600;margin:0 0 16px;line-height:1.5}
.prompt b{font-weight:800;border-bottom:2px solid var(--hl-1);padding-bottom:1px}
.sentence{
  font-family:var(--read);font-size:19px;line-height:1.7;
  border-left:4px solid var(--hl-1);padding:2px 0 2px 16px;margin:0 0 20px;
}
.passage{
  font-family:var(--read);font-size:16px;line-height:1.75;background:#F3EEDF;
  border:1px solid var(--rule);padding:16px 18px;margin:0 0 20px;
}
.passage h4{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--slate);margin:0 0 8px;font-weight:700;
}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:9px;margin:0}
.opt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  border:1.5px solid var(--rule);background:#fff;padding:12px 14px;
  font-size:15.5px;color:var(--ink);line-height:1.45;transition:border-color .12s,background .12s;
}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .key{
  font-family:var(--mono);font-weight:700;font-size:13px;flex:none;
  width:22px;height:22px;border:1.5px solid var(--ink);
  display:grid;place-items:center;margin-top:1px;
}
.opt.sel{border-color:var(--ink);background:#FDF8E6}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .key{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opts.tfng{flex-direction:row;flex-wrap:wrap}
.opts.tfng .opt{flex:1;min-width:150px}

/* ---------- typed answer ---------- */
.gapwrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 0}
.gap{
  border:none;border-bottom:2.5px solid var(--ink);background:#FDF8E6;
  font-size:20px;font-family:var(--read);padding:7px 12px;min-width:200px;color:var(--ink);
}
.gap:focus{outline:none;border-bottom-color:var(--good);background:#F9EFC9}
.gap.right{border-bottom-color:var(--good);background:var(--good-bg)}
.gap.wrong{border-bottom-color:var(--bad);background:var(--bad-bg)}
.gap:disabled{opacity:1}

/* ---------- listening ---------- */
.audiobox{
  border:1.5px dashed var(--ink);padding:16px 18px;margin:0 0 18px;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:#F4F7EC;
}
.playbtn{
  border:2px solid var(--ink);background:var(--hl-6);color:var(--ink);
  font-weight:700;font-size:14px;padding:10px 18px;display:flex;gap:9px;align-items:center;
}
.playbtn:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.playbtn.playing{background:var(--ink);color:#fff}
.speedbtn{
  border:1.5px solid var(--ink);background:transparent;font-family:var(--mono);
  font-size:12px;padding:8px 11px;letter-spacing:.05em;
}
.speedbtn.on{background:var(--ink);color:#fff}
.audionote{font-family:var(--mono);font-size:11px;color:var(--slate);letter-spacing:.05em}
.transcript{
  font-family:var(--read);font-size:16px;background:#F3EEDF;border-left:4px solid var(--hl-6);
  padding:10px 14px;margin:12px 0 0;
}
.notes{
  border:1px solid var(--rule);border-top:3px solid var(--hl-6);
  padding:14px 16px;margin:0 0 16px;background:#fff;
}
.notes h4{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  margin:0 0 8px;color:var(--slate);font-weight:700;
}
.notes p{font-family:var(--read);font-size:17px;margin:0;line-height:1.7}

/* ---------- word bank ---------- */
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.bankword{
  font-family:var(--read);font-size:15px;border:1.5px solid var(--ink);
  padding:6px 12px;background:#fff;
}
.bankword.used{opacity:.3;text-decoration:line-through}

/* ---------- feedback ---------- */
.fb{border-left:5px solid var(--good);background:var(--good-bg);padding:15px 17px;margin:18px 0 0}
.fb.no{border-left-color:var(--bad);background:var(--bad-bg)}
.fb-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 9px}
.fb-verdict{font-weight:800;font-size:15px;letter-spacing:-.01em}
.fb-pts{font-family:var(--mono);font-size:12px;color:var(--slate)}
.fb p{margin:0 0 8px;font-size:15px;line-height:1.55}
.fb p:last-child{margin-bottom:0}
.wordcard{
  background:#fff;border:1px solid var(--rule);padding:12px 14px;margin:10px 0 0;
}
.wordcard .w{font-weight:800;font-size:17px;letter-spacing:-.01em}
.wordcard .pos{font-family:var(--mono);font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:.1em;margin-left:8px}
.wordcard .ar{font-family:var(--ar);font-size:19px;direction:rtl;unicode-bidi:embed;display:block;margin:5px 0 6px;color:var(--ink-2)}
.wordcard .def{font-family:var(--read);font-size:15px;color:var(--ink-2);margin:0 0 6px}
.wordcard .ex{font-family:var(--read);font-size:14.5px;color:var(--slate);font-style:italic;margin:0}

/* ---------- nav ---------- */
.nav{display:flex;gap:12px;align-items:center;margin:22px 0 0;flex-wrap:wrap}
.nav .spacer{flex:1}

/* ---------- rail ---------- */
.rail{position:sticky;top:20px}
.rail-block{border:2px solid var(--ink);background:#fff;padding:14px;margin:0 0 14px}
.rail-block h3{
  font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  margin:0 0 11px;color:var(--slate);font-weight:700;
}
.score-big{font-size:36px;font-weight:800;letter-spacing:-.04em;line-height:1}
.score-big span{font-size:16px;color:var(--slate);font-weight:600}
.stat{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;padding:4px 0;border-bottom:1px dotted var(--rule)}
.stat:last-child{border-bottom:none}
.stat b{font-weight:700}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.cell{
  aspect-ratio:1;border:1px solid var(--rule);background:#fff;
  font-family:var(--mono);font-size:11px;color:var(--slate);
  display:grid;place-items:center;padding:0;
}
.cell:hover{border-color:var(--ink)}
.cell.now{outline:2px solid var(--ink);outline-offset:-2px;font-weight:700;color:var(--ink)}
.cell.ok{background:var(--good);border-color:var(--good);color:#fff}
.cell.no{background:var(--bad);border-color:var(--bad);color:#fff}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{
  font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  border:1.5px solid var(--ink);padding:4px 7px;background:var(--hl-1);font-weight:700;
  animation:pop .4s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.rail-empty{font-family:var(--mono);font-size:11px;color:var(--slate)}

/* ---------- results ---------- */
.results{max-width:860px}
.bigscore{display:flex;flex-wrap:wrap;gap:34px;align-items:flex-end;border-bottom:2px solid var(--ink);padding:0 0 22px;margin:0 0 26px}
.bigscore .n{font-size:clamp(56px,11vw,96px);font-weight:800;letter-spacing:-.05em;line-height:.9}
.bigscore .n small{font-size:.32em;color:var(--slate);letter-spacing:-.02em}
.bigscore .meta{font-family:var(--mono);font-size:12px;color:var(--slate);letter-spacing:.06em;line-height:1.9}
.readiness{border:2px solid var(--ink);padding:14px 18px;background:var(--hl-1)}
.readiness .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.readiness .val{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.readiness .cap{font-family:var(--mono);font-size:10px;color:var(--ink-2);margin-top:4px}
h2.sec{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:34px 0 14px;text-transform:lowercase}
.bar-row{display:flex;align-items:center;gap:12px;margin:0 0 9px}
.bar-name{width:190px;flex:none;font-size:14px;font-weight:600}
.bar-track{flex:1;height:20px;background:#E9E2CF;border:1px solid var(--rule);position:relative}
.bar-fill{display:block;height:100%;transition:width .8s cubic-bezier(.2,.8,.3,1)}
.bar-num{font-family:var(--mono);font-size:12px;width:52px;text-align:right;flex:none}
.revise{display:flex;flex-wrap:wrap;gap:8px}
.revise .rw{
  font-family:var(--read);font-size:16px;border:1.5px solid var(--ink);padding:7px 13px;background:#fff;
}
.revise .rw .ar{font-family:var(--ar);direction:rtl;color:var(--slate);font-size:15px;margin-left:8px}

/* ---------- certificate ---------- */
.cert{
  border:3px double var(--ink);padding:38px 34px;text-align:center;background:#fff;margin:16px 0 0;
  background-image:radial-gradient(circle at 12% 18%,var(--hl-1) 0 1.5px,transparent 1.6px),
                   radial-gradient(circle at 88% 82%,var(--hl-2) 0 1.5px,transparent 1.6px);
  background-size:26px 26px;
}
.cert .k{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--slate)}
.cert .who{font-family:var(--read);font-size:clamp(26px,5vw,38px);margin:14px 0 6px;font-weight:400}
.cert .what{font-family:var(--read);font-size:16px;color:var(--ink-2);max-width:460px;margin:0 auto 18px}
.cert .sc{font-size:44px;font-weight:800;letter-spacing:-.04em}
.cert .sig{margin-top:24px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--slate)}

/* ---------- review list ---------- */
.rev-item{border-left:4px solid var(--bad);background:#fff;border-top:1px solid var(--rule);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:13px 16px;margin:0 0 10px}
.rev-q{font-family:var(--mono);font-size:11px;color:var(--slate);letter-spacing:.08em;margin:0 0 5px}
.rev-p{font-size:15px;margin:0 0 7px;font-family:var(--read)}
.rev-a{font-size:14px;margin:0}
.rev-a b{color:var(--good)}
.rev-a s{color:var(--bad)}

/* ---------- footer ---------- */
footer{
  border-top:2px solid var(--ink);margin-top:56px;padding:16px 0;
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);
}
footer .spacer{flex:1}

/* ---------- confetti ---------- */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:99}

/* ---------- toast ---------- */
#toast{
  visibility:hidden;
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);
  background:var(--ink);color:#fff;padding:12px 20px;font-size:14px;font-weight:600;
  z-index:120;transition:transform .3s cubic-bezier(.2,.9,.3,1);max-width:88vw;
}
#toast.show{visibility:visible;transform:translateX(-50%) translateY(0)}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .layout{grid-template-columns:1fr;gap:22px}
  .rail{position:static;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .rail-block{margin:0}
  .rail-block.gridblock{grid-column:1/-1}
  .grid{grid-template-columns:repeat(10,1fr)}
  .card::after{display:none}
}
@media (max-width:560px){
  .wrap{padding:0 14px 60px}
  .card{padding:18px 16px}
  .bar-name{width:100%}
  .bar-row{flex-wrap:wrap}
  .rail{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
@media print{
  .noprint,#toast,#confetti{display:none!important}
  body{background:#fff}
  .cert{border-color:#000}
}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">

  <header class="mast">
    <div>
      <h1>wordlist <span class="hl" style="--swipe:var(--hl-1)">one</span></h1>
      <p class="sub">B1+ Vocabulary · Fall · "Education" · 40 words · 50 questions</p>
    </div>
    <div class="spacer"></div>
    <div class="chip">Target: IELTS Band 6</div>
  </header>

  <main id="app"></main>

  <footer>
    <span>B1+ Vocabulary List 1 (Fall) — Education</span>
    <span class="spacer"></span>
    <span>Designed by: Nazila Motahari</span>
  </footer>
</div>
<canvas id="confetti"></canvas>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="loadfile" accept=".json" style="display:none">
<script>
/* =========================================================================
   B1+ Vocabulary List 1 (Fall) — "Education"
   50-question IELTS-style quiz engine
   ========================================================================= */

/* ---------------- Word data (from the wordlist) ---------------- */
const W = {
  absolutely:{pos:"adverb",ar:"تماماً / بالتأكيد",def:"Completely",ex:"I absolutely agree that you need to work harder."},
  ambition:{pos:"noun",ar:"طموح",def:"Something that you want to do in your life",ex:"My ambition is to become a doctor after I graduate."},
  application:{pos:"noun",ar:"طلب رسمي",def:"An official request for something, usually in writing",ex:"I've sent applications to four different universities."},
  attempt:{pos:"verb",ar:"يحاول",def:"To try to do something",ex:"Check the examples first, and then attempt the exercises on the page."},
  attitude:{pos:"noun",ar:"موقف / سلوك",def:"How you think or feel about something",ex:"He has a very bad attitude towards work."},
  bell:{pos:"noun",ar:"جرس",def:"An electrical object that makes a ringing sound when you press a switch",ex:"The exam will finish when you hear the bell."},
  ceremony:{pos:"noun",ar:"حفل رسمي",def:"A formal event performed on an important social or religious occasion",ex:"Students must attend the graduation ceremony at the University."},
  count:{pos:"verb",ar:"يَعُدّ",def:"To see how many people or things there are",ex:"Did you count the number of students in class today?"},
  despite:{pos:"preposition",ar:"على الرغم من",def:"Although something happened or is true",ex:"I'm happy with the course despite failing one of the tests."},
  essay:{pos:"noun",ar:"مقال",def:"A short piece of writing about a subject, especially one written by a student",ex:"For homework I want you to write an essay on education in the UAE."},
  explanation:{pos:"noun",ar:"شرح / تفسير",def:"The details or reasons someone gives to make something clear",ex:"Could you give me a quick explanation of how to solve this math problem?"},
  fairly:{pos:"adverb",ar:"إلى حد ما",def:"More than average, but less than very",ex:"You did fairly well in the test, but you could have done better."},
  fee:{pos:"noun",ar:"رسوم",def:"An amount of money that you pay to do or use something",ex:"The students are not happy about the increase in their fees."},
  lecture:{pos:"noun",ar:"محاضرة",def:"A talk to a group of people about a subject",ex:"We went to a lecture on Emirati culture."},
  mention:{pos:"verb",ar:"يذكر",def:"To speak or write a few words about something or someone",ex:"He mentioned that he liked reading horror stories."},
  obvious:{pos:"adjective",ar:"واضح",def:"Easy to understand or see",ex:"You may think the answer is obvious, but I don't."},
  obviously:{pos:"adverb",ar:"من الواضح",def:"In a way that is easy to understand or see",ex:"She's obviously intelligent, but she doesn't make a lot of effort."},
  partly:{pos:"adverb",ar:"جزئياً",def:"To some degree but not completely",ex:"She was partly successful. She passed the coursework, but failed the final exam."},

  proper:{pos:"adjective",ar:"مناسب / صحيح",def:"Correct or suitable; real and satisfactory",ex:"You have to ensure your child receives a proper education."},

const LOCKED_SECTIONS = [7];

/* ---------------- Randomise on every load ----------------
   Both the question order (within each section) and the answer
   options change each time the app opens, so neither sequence nor
   position can be learned or shared between students. The order a
   student actually saw is stored in state, so a saved file reloads
   exactly as they left it instead of being scrambled.            */
Q.forEach((q,k)=>{ q.id=k; if(q.opts){ q._opts0=q.opts.slice(); q._a0=q.a; } });
const Q0 = Q.slice();
function groupKey(q){ return q.s + (q.diagram ? "/"+q.diagram : ""); }
function shuffleQuestions(qorder){
  if(!qorder){
    const groups=[], seen={};
    Q0.forEach(q=>{ const k=groupKey(q);
      if(!(k in seen)){ seen[k]=groups.length; groups.push([]); }
      groups[seen[k]].push(q); });
    qorder=[];
    groups.forEach(g=>{
      const ids=g.map(q=>q.id);
      if(!LOCKED_SECTIONS.includes(g[0].s)){
        for(let j=ids.length-1;j>0;j--){ const r=Math.floor(Math.random()*(j+1)); [ids[j],ids[r]]=[ids[r],ids[j]]; }
      }
      qorder=qorder.concat(ids);
    });
  }
  const byId={}; Q0.forEach(q=>byId[q.id]=q);
  Q.length=0; qorder.forEach(id=>Q.push(byId[id]));
  return qorder;
}
function shuffleOptions(order){
  order = order || {};
  Q.forEach(q=>{
    if(!q._opts0 || q._opts0.length<2) return;
    let perm = order[q.id];
    if(!perm){
      perm = q._opts0.map((_,k)=>k);
      for(let j=perm.length-1;j>0;j--){ const r=Math.floor(Math.random()*(j+1)); [perm[j],perm[r]]=[perm[r],perm[j]]; }
      order[q.id]=perm;
    }
    q.opts = perm.map(k=>q._opts0[k]);
    q.a = perm.indexOf(q._a0);
  });
  return order;
}

/* ---------------- State ---------------- */
let S = null;
function newState(name){
  const st={name:name||"Student", i:0, res:{}, given:{}, points:0, streak:0, bestStreak:0,
          correct:0, answered:0, badges:[], started:Date.now(), finished:false, rate:1};
  st.qorder=shuffleQuestions(null);
  st.order=shuffleOptions(null);
  return st;
}
function secCorrect(s,sec){
  let n=0; Q.forEach((q,i)=>{ if(q.s===sec && s.res[i]===true) n++; }); return n;
}
function secTotal(sec){ return Q.filter(q=>q.s===sec).length; }
function sec(id){ return SECTIONS.find(x=>x.id===id); }

/* ---------------- Helpers ---------------- */
const el = id => document.getElementById(id);
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function mark(sent,color){
  // ~word~ becomes a highlighter swipe
  return sent.replace(/~([^~]+)~/g,(m,p1)=>`<span class="hl" style="--swipe:${color}">${p1}</span>`);
}
function norm(t){
  return String(t||"").toLowerCase().trim()
    .replace(/[.,!?;:'"()]/g,"").replace(/\s+/g," ").trim();
}
function toast(msg){
  const t=el("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600);
}

/* ---------------- Start screen ---------------- */
function renderStart(){
  el("app").innerHTML = `
  <div class="start">
    <p class="lede">Forty words from your <b>Education</b> wordlist, tested the way IELTS tests them:
    meaning in context, paraphrase, word forms, True/False/Not Given, note completion from audio, and
    summary gaps. Fifty questions in seven sections — you can stop and come back later.</p>

    <div class="namefield">
      <label for="who">Your name</label>
      <input id="who" placeholder="Type your name" autocomplete="off" maxlength="40">
    </div>

    <div class="plan">
      ${SECTIONS.map(s=>`
      <div class="plan-row">
        <span class="plan-tag" style="background:${s.hl}"></span>
        <span class="plan-name">${s.name}</span>
        <span class="plan-desc">${s.desc}</span>
        <span class="plan-n">${secTotal(s.id)} Q</span>
      </div>`).join("")}
    </div>

    <div class="btnrow">
      <button class="btn" id="go">Start the quiz</button>
      <button class="btn ghost sm" id="loadbtn">Load saved progress</button>
    </div>
    <p class="audionote" style="margin-top:18px">Section 6 plays audio through your browser. Turn your sound on, or use headphones.</p>
  </div>`;

  el("go").onclick = ()=>{ S = newState(el("who").value.trim()); render(); };
  el("loadbtn").onclick = ()=> el("loadfile").click();
}

/* ---------------- Question rendering ---------------- */
function render(){
  if(S.finished) return renderResults();
  const i=S.i, q=Q[i], sc=sec(q.s), done = S.res[i]!==undefined;

  let body="";

  /* --- stimulus --- */
  if(q.s===5){
    body += `<div class="passage"><h4>Reading passage — Al Noor College</h4>${PASSAGE}</div>`;
  }
  if(q.s===7){
    body += `<div class="passage"><h4>Summary — student success</h4>${summaryHTML()}</div>
             <div class="bank">${BANK.map(b=>`<span class="bankword${bankUsed(b,i)?" used":""}">${b}</span>`).join("")}</div>`;
  }
  if(q.listen){
    body += `<div class="audiobox">
      <button class="playbtn" id="play"><span>▶</span> Play audio</button>
      <button class="speedbtn${S.rate===1?" on":""}" data-rate="1">1.0×</button>
      <button class="speedbtn${S.rate===0.75?" on":""}" data-rate="0.75">0.75×</button>
      <span class="audionote">You may listen as many times as you need.</span>
    </div>
    <div class="notes"><h4>Complete the notes</h4><p>${q.notes.replace("______",done?`<span class="hl" style="--swipe:${sc.hl}">${q.a}</span>`:"<b>______</b>")}</p></div>`;
  }
  if(q.sent){
    body += `<p class="sentence" style="border-left-color:${sc.hl}">${mark(q.sent,sc.hl)}</p>`;
  }

  body += `<p class="prompt">${q.prompt}</p>`;

  /* --- answer area --- */
  if(q.tfng){
    body += `<div class="opts tfng">${TFNG_OPTS.map((o,k)=>optBtn(o,k,i,q,done)).join("")}</div>`;
  } else if(q.bank){
    body += `<div class="opts">${bankOptions(q).map((o,k)=>optBtn(o,k,i,q,done,true)).join("")}</div>`;
  } else if(q.opts){
    body += `<div class="opts">${q.opts.map((o,k)=>optBtn(o,k,i,q,done)).join("")}</div>`;
  } else {
    const g = S.given[i]||"";
    body += `<div class="gapwrap">
      <input class="gap ${done?(S.res[i]?"right":"wrong"):""}" id="gapin" value="${esc(g)}"
        placeholder="one word" autocomplete="off" autocapitalize="off" spellcheck="false" ${done?"disabled":""}>
      ${done?"":'<button class="btn sm" id="check">Check answer</button>'}
    </div>`;
  }

  /* --- feedback --- */
  if(done) body += feedbackHTML(i,q);

  el("app").innerHTML = `
  <div class="layout">
    <div>
      <div class="card">
        <div class="qhead">
          <span class="qnum">Q${i+1} / 50</span>
          <span class="sectag" style="background:${sc.hl}">${sc.name}</span>
          <span class="spacer"></span>
          <span class="instr">${sc.instr}</span>
        </div>
        ${body}
      </div>
      <div class="nav noprint">
        <button class="btn ghost sm" id="prev" ${i===0?"disabled":""}>← Back</button>
        <button class="btn sm" id="next">${i===49?"Finish and see results":"Next →"}</button>
        <span class="spacer"></span>
        <button class="btn ghost sm" id="save">Save progress</button>
        <button class="btn ghost sm" id="quit">Finish now</button>
      </div>
    </div>
    ${railHTML()}
  </div>`;

  wire(i,q,done);
}

function optBtn(text,k,i,q,done,isBank){
  const keys="ABCD EFG".split("");
  let cls="opt";
  const chosen = S.given[i];
  const correctKey = isBank ? q.a : q.a;
  if(done){
    const isCorrect = isBank ? (text===q.a) : (k===q.a);
    if(isCorrect) cls+=" right";
    else if(isBank ? (chosen===text) : (chosen===k)) cls+=" wrong";
  } else if(isBank ? chosen===text : chosen===k){ cls+=" sel"; }
  return `<button class="${cls}" data-k="${isBank?esc(text):k}" ${done?"disabled":""}>
    <span class="key">${keys[k]}</span><span>${text}</span></button>`;
}

function bankOptions(q){
  // 4 plausible options drawn from the bank, always including the answer
  const pool = BANK.filter(b=>b!==q.a);
  const seed = q.gapno;
  const picks=[]; let n=seed;
  while(picks.length<3){ n=(n*7+11)%pool.length; if(!picks.includes(pool[n])) picks.push(pool[n]); }
  const all=[...picks,q.a];
  // deterministic shuffle
  return all.sort((a,b)=>((a.charCodeAt(0)*seed)%13)-((b.charCodeAt(0)*seed)%13));
}
function bankUsed(word,curIdx){
  for(let j=44;j<50;j++){ if(j!==curIdx && S.res[j]===true && Q[j].a===word) return true; }
  return false;
}
function summaryHTML(){
  return SUMMARY.map(p=>{
    if(p.t) return p.t;
    const idx = 44 + (p.gap-45);
    const solved = S.res[idx]===true;
    return solved
      ? `<b>${Q[idx].a}</b>`
      : `<b style="font-family:var(--mono);font-size:.85em">(${p.gap})</b> ______`;
  }).join("");
}

function feedbackHTML(i,q){
  const ok=S.res[i], w=W[q.w], sc=sec(q.s);
  let right;
  if(q.tfng) right=TFNG_OPTS[q.a];
  else if(q.opts) right=q.opts[q.a];
  else right=q.a;
  return `<div class="fb ${ok?"":"no"}">
    <div class="fb-top">
      <span class="fb-verdict">${ok?"Correct.":"Not this time."}</span>
      <span class="fb-pts">${ok?"+"+S.given["pts"+i]+" points":"Answer: "+right}</span>
    </div>
    <p>${q.why}</p>
    ${q.listen?`<div class="transcript"><b>Transcript:</b> ${q.audio}</div>`:""}
    <div class="wordcard">
      <span class="w">${q.w}</span><span class="pos">${w.pos}</span>
      <span class="ar">${w.ar}</span>
      <p class="def">${w.def}</p>
      <p class="ex">"${w.ex}"</p>
    </div>
  </div>`;
}

function railHTML(){
  const pct = S.answered? Math.round(S.correct/S.answered*100):0;
  return `<aside class="rail noprint">
    <div class="rail-block">
      <h3>Score</h3>
      <div class="score-big">${S.correct}<span>/${S.answered||0} answered</span></div>
      <div style="margin-top:10px">
        <div class="stat"><span>Points</span><b>${S.points}</b></div>
        <div class="stat"><span>Streak</span><b>${S.streak}${S.streak>=3?" 🔥":""}</b></div>
        <div class="stat"><span>Accuracy</span><b>${pct}%</b></div>
      </div>
    </div>
    <div class="rail-block gridblock">
      <h3>Answer sheet</h3>
      <div class="grid" id="grid">
        ${Q.map((q,k)=>{
          let c="cell";
          if(k===S.i) c+=" now";
          if(S.res[k]===true) c+=" ok"; else if(S.res[k]===false) c+=" no";
          return `<button class="${c}" data-i="${k}" title="Question ${k+1}">${k+1}</button>`;
        }).join("")}
      </div>
    </div>
    <div class="rail-block">
      <h3>Badges</h3>
      ${S.badges.length? `<div class="badges">${S.badges.map(b=>{
          const bd=BADGES.find(x=>x.id===b); return `<span class="badge">${bd.label}</span>`;
        }).join("")}</div>` : `<p class="rail-empty">None yet — answer some questions.</p>`}
    </div>
  </aside>`;
}

/* ---------------- Interaction ---------------- */
function wire(i,q,done){
  document.querySelectorAll("#grid .cell").forEach(c=>{
    c.onclick=()=>{ S.i=+c.dataset.i; render(); };
  });
  el("prev").onclick=()=>{ if(S.i>0){S.i--;render();} };
  el("next").onclick=()=>{ if(S.i<49){S.i++;render();} else finish(); };
  el("save").onclick=saveJSON;
  el("quit").onclick=()=>{ if(confirm("Finish the quiz now and see your results?")) finish(); };

  if(!done){
    document.querySelectorAll(".opt").forEach(b=>{
      b.onclick=()=>{
        const raw=b.dataset.k;
        const val = q.bank ? raw : +raw;
        submit(i,q,val);
      };
    });
    const gi=el("gapin");
    if(gi){
      gi.focus();
      gi.oninput=()=>{ S.given[i]=gi.value; };
      gi.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); submit(i,q,gi.value); } };
      const cb=el("check"); if(cb) cb.onclick=()=>submit(i,q,gi.value);
    }
  }

  if(q.listen){
    const pb=el("play");
    pb.onclick=()=>speak(q.audio,pb);
    document.querySelectorAll(".speedbtn").forEach(b=>{
      b.onclick=()=>{ S.rate=+b.dataset.rate;
        document.querySelectorAll(".speedbtn").forEach(x=>x.classList.remove("on"));
        b.classList.add("on"); };
    });
  }
}

function submit(i,q,val){
  if(S.res[i]!==undefined) return;
  let ok;
  if(q.tfng || (q.opts && !q.bank)) ok = (val===q.a);
  else if(q.bank) ok = (val===q.a);
  else ok = (q.accept||[q.a]).some(a=>norm(a)===norm(val));

  if(!q.opts && !q.tfng && !q.bank && norm(val)==="") { toast("Type a word first."); return; }

  S.given[i]=val;
  S.res[i]=ok;
  S.answered++;
  if(ok){
    S.correct++; S.streak++;
    S.bestStreak=Math.max(S.bestStreak,S.streak);
    let pts = 2 + (S.streak>=3?1:0) + (S.streak>=6?1:0);
    S.given["pts"+i]=pts; S.points+=pts;
  } else { S.streak=0; }

  const before=[...S.badges];
  BADGES.forEach(b=>{ if(!S.badges.includes(b.id) && b.test(S)) S.badges.push(b.id); });
  const gained=S.badges.filter(b=>!before.includes(b));

  render();
  if(gained.length) toast("Badge unlocked: "+BADGES.find(b=>b.id===gained[0]).label);
  if(S.streak===5) burst(60);
}

/* ---------------- Speech ---------------- */
function speak(text,btn){
  if(!("speechSynthesis" in window)){
    toast("Your browser cannot play audio. Read the transcript in the feedback instead.");
    return;
  }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=S.rate; u.pitch=1; u.lang="en-GB";
  const vs=speechSynthesis.getVoices();
  const v=vs.find(x=>/en-GB/i.test(x.lang)) || vs.find(x=>/en/i.test(x.lang));
  if(v) u.voice=v;
  btn.classList.add("playing"); btn.innerHTML="<span>■</span> Playing…";
  u.onend=()=>{ btn.classList.remove("playing"); btn.innerHTML="<span>▶</span> Play again"; };
  u.onerror=()=>{ btn.classList.remove("playing"); btn.innerHTML="<span>▶</span> Play audio";
                  toast("Audio failed. Use the transcript after you answer."); };
  speechSynthesis.speak(u);
}
if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged=()=>{}; }

/* ---------------- Results ---------------- */
function readiness(pct){
  if(pct>=92) return {v:"Band 6.5 – 7 range",c:"var(--hl-2)"};
  if(pct>=80) return {v:"Band 6 range",c:"var(--hl-1)"};
  if(pct>=66) return {v:"Band 5.5 range",c:"var(--hl-4)"};
  if(pct>=50) return {v:"Band 5 range",c:"var(--hl-3)"};
  return {v:"Below Band 5 — revise the list",c:"var(--hl-3)"};
}
function finish(){ S.finished=true; S.ended=Date.now(); render(); }

function renderResults(){
  const pct=Math.round(S.correct/50*100);
  const r=readiness(pct);
  const mins=Math.max(1,Math.round(((S.ended||Date.now())-S.started)/60000));
  const wrong=Q.map((q,i)=>({q,i})).filter(x=>S.res[x.i]===false);
  const unans=Q.map((q,i)=>i).filter(i=>S.res[i]===undefined);
  const reviseWords=[...new Set(wrong.map(x=>x.q.w))];

  el("app").innerHTML=`
  <div class="results">
    <div class="bigscore">
      <div class="n">${S.correct}<small>/50</small></div>
      <div class="meta">
        ${pct}% correct<br>${S.points} points · best streak ${S.bestStreak}<br>
        ${mins} minute${mins>1?"s":""}${unans.length?` · ${unans.length} not answered`:""}
      </div>
      <div class="readiness" style="background:${r.c}">
        <div class="lab">Vocabulary readiness</div>
        <div class="val">${r.v}</div>
        <div class="cap">Guide only — based on this wordlist, not an official IELTS score.</div>
      </div>
    </div>

    <h2 class="sec">by section</h2>
    ${SECTIONS.map(s=>{
      const c=secCorrect(S,s.id), t=secTotal(s.id), p=Math.round(c/t*100);
      return `<div class="bar-row">
        <span class="bar-name">${s.name}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${p}%;background:${s.hl}"></span></span>
        <span class="bar-num">${c}/${t}</span>
      </div>`;
    }).join("")}

    ${reviseWords.length?`
    <h2 class="sec">words to revise</h2>
    <div class="revise">${reviseWords.map(w=>
      `<span class="rw">${w}<span class="ar">${W[w].ar}</span></span>`).join("")}</div>`:
    `<h2 class="sec">words to revise</h2><p class="lede" style="font-size:17px">Nothing — you answered every question correctly. Excellent work.</p>`}

    ${wrong.length?`
    <h2 class="sec">check your mistakes</h2>
    ${wrong.map(x=>{
      let right = x.q.tfng?TFNG_OPTS[x.q.a] : (x.q.opts?x.q.opts[x.q.a]:x.q.a);
      let mine  = x.q.tfng?TFNG_OPTS[S.given[x.i]] : (x.q.opts&&!x.q.bank?x.q.opts[S.given[x.i]]:S.given[x.i]);
      let stem;
      if(x.q.sent) stem = mark(x.q.sent,"#E9E2CF");
      else if(x.q.listen) stem = x.q.notes.replace("______","<b>______</b>")
             + ` <span style="color:var(--slate)">— you heard: "${x.q.audio}"</span>`;
      else if(x.q.bank) stem = gapContext(x.q.gapno);
      else stem = x.q.prompt;
      return `<div class="rev-item">
        <p class="rev-q">Q${x.i+1} · ${sec(x.q.s).name}</p>
        <p class="rev-p">${stem}</p>
        <p class="rev-a">You wrote <s>${esc(mine||"—")}</s> · Correct: <b>${esc(right)}</b></p>
      </div>`;
    }).join("")}`:""}

    ${pct>=80?certHTML(pct):`
      <h2 class="sec">certificate</h2>
      <p class="lede" style="font-size:17px">Reach <b>80%</b> (40 out of 50) to earn your certificate.
      You are ${40-S.correct} question${40-S.correct===1?"":"s"} away. Revise the words above and try again.</p>`}

    <div class="btnrow noprint" style="margin-top:34px">
      <button class="btn" id="again">Try again</button>
      <button class="btn ghost sm" id="save2">Save results (JSON)</button>
      ${pct>=80?'<button class="btn ghost sm" id="print">Print certificate</button>':""}
    </div>
  </div>`;

  el("again").onclick=()=>{ S=newState(S.name); render(); };
  el("save2").onclick=saveJSON;
  if(el("print")) el("print").onclick=()=>window.print();
  if(pct>=80) burst(220);
}

function gapContext(gapno){
  const k=SUMMARY.findIndex(p=>p.gap===gapno);
  const b=((SUMMARY[k-1]||{}).t||"").trim().split(/\s+/).slice(-9).join(" ");
  const a=((SUMMARY[k+1]||{}).t||"").trim().split(/\s+/).slice(0,9).join(" ");
  return `&hellip;${b} <b>______</b> ${a}&hellip;`;
}
function certHTML(pct){
  const d=new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  return `<h2 class="sec noprint">certificate</h2>
  <div class="cert">
    <div class="k">Certificate of Achievement</div>
    <div class="who">${esc(S.name||"Student")}</div>
    <div class="what">has successfully completed the B1+ Vocabulary List 1 (Fall) &ldquo;Education&rdquo;
    quiz — 50 IELTS-style questions across reading and listening formats.</div>
    <div class="sc">${S.correct}/50 &middot; ${pct}%</div>
    <div class="k" style="margin-top:8px">${readiness(pct).v}</div>
    <div class="sig">${d} &nbsp;·&nbsp; Higher Colleges of Technology &nbsp;·&nbsp; Designed by: Nazila Motahari</div>
  </div>`;
}

/* ---------------- Save / load (JSON file) ---------------- */
function saveJSON(){
  const data={app:"B1+ Wordlist 1 Education Quiz",version:1,saved:new Date().toISOString(),state:S};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`wordlist1-${(S.name||"student").replace(/\s+/g,"-").toLowerCase()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast("Progress saved to your downloads folder.");
}
el("loadfile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d.state||typeof d.state.i!=="number") throw 0;
      S=d.state; shuffleQuestions(S.qorder||null); shuffleOptions(S.order||null); render();
      toast("Progress loaded. Continue where you stopped.");
    }catch(err){ toast("That file could not be read. Choose a saved quiz file."); }
  };
  rd.readAsText(f); e.target.value="";
});

/* ---------------- Confetti ---------------- */
const cv=el("confetti"), cx=cv.getContext("2d");
let parts=[],raf=null;
function sizeC(){ cv.width=innerWidth; cv.height=innerHeight; }
addEventListener("resize",sizeC); sizeC();
function burst(n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols=["#E8B52E","#A8C98A","#F0A3A0","#F2C98A","#C8B6E0","#9FC6DE","#332B1E"];
  for(let i=0;i<n;i++){
    parts.push({x:innerWidth/2+(Math.random()-.5)*260, y:innerHeight*0.32,
      vx:(Math.random()-.5)*11, vy:Math.random()*-13-4,
      w:5+Math.random()*7, h:8+Math.random()*10,
      c:cols[i%cols.length], r:Math.random()*6, vr:(Math.random()-.5)*.35, life:150});
  }
  if(!raf) tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0 && p.y<cv.height+40);
  parts.forEach(p=>{
    p.vy+=0.32; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life--;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r);
    cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
  });
  raf = parts.length? requestAnimationFrame(tick) : (cx.clearRect(0,0,cv.width,cv.height),null);
}

/* ---------------- Keyboard ---------------- */
addEventListener("keydown",e=>{
  if(!S||S.finished) return;
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight"&&S.i<49){S.i++;render();}
  if(e.key==="ArrowLeft"&&S.i>0){S.i--;render();}
  const q=Q[S.i];
  if(S.res[S.i]===undefined && /^[1-4]$/.test(e.key)){
    const btns=document.querySelectorAll(".opt");
    const b=btns[+e.key-1]; if(b) b.click();
  }
});

/* ---------------- Go ---------------- */
renderStart();

</script>
